name: Build Android Release APK

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout
  uses: actions/checkout@v4
  with:
    ref: android-local

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Play upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.STRONG_GYM_UPLOAD_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/strong-gym-play-upload.jks"
          chmod 600 "$RUNNER_TEMP/strong-gym-play-upload.jks"

      - name: Build signed Release APK
        working-directory: android
        env:
          STRONG_GYM_KEYSTORE_FILE: ${{ runner.temp }}/strong-gym-play-upload.jks
          STRONG_GYM_KEYSTORE_PASSWORD: ${{ secrets.STRONG_GYM_KEYSTORE_PASSWORD }}
          STRONG_GYM_KEY_ALIAS: ${{ secrets.STRONG_GYM_KEY_ALIAS }}
          STRONG_GYM_KEY_PASSWORD: ${{ secrets.STRONG_GYM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: strong-gym-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
