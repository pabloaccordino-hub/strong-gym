name: Build Android Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - android-local

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean node_modules
        run: rm -rf node_modules

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Play upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.STRONG_GYM_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secreto STRONG_GYM_UPLOAD_KEYSTORE_B64."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/strong-gym-play-upload.jks"
          chmod 600 "$RUNNER_TEMP/strong-gym-play-upload.jks"

      - name: Build signed release AAB
        working-directory: android
        env:
          STRONG_GYM_KEYSTORE_FILE: ${{ runner.temp }}/strong-gym-play-upload.jks
          STRONG_GYM_KEYSTORE_PASSWORD: ${{ secrets.STRONG_GYM_KEYSTORE_PASSWORD }}
          STRONG_GYM_KEY_ALIAS: ${{ secrets.STRONG_GYM_KEY_ALIAS }}
          STRONG_GYM_KEY_PASSWORD: ${{ secrets.STRONG_GYM_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify AAB signature
        working-directory: android
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-signature.txt"
          tail -n 30 "$RUNNER_TEMP/aab-signature.txt"

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: strong-gym-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
